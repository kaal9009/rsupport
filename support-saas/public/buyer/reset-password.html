<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a New Password</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Set your password</h1>
    <p class="sub">This is your first login — choose a new password (at least 10 characters).</p>
    <label>New password</label>
    <input id="pw1" type="password" autocomplete="new-password">
    <label>Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password">
    <div class="err" id="err"></div>
    <button class="primary" id="go">Save and continue</button>
  </div>
</div>
<script>
  document.getElementById('go').onclick = async () => {
    const pw1 = document.getElementById('pw1').value;
    const pw2 = document.getElementById('pw2').value;
    const err = document.getElementById('err');
    err.textContent = '';
    if (pw1.length < 10) { err.textContent = 'Password must be at least 10 characters.'; return; }
    if (pw1 !== pw2) { err.textContent = 'Passwords do not match.'; return; }
    try {
      const res = await fetch('/api/buyer/reset-password', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ new_password: pw1 })
      });
      const data = await res.json();
      if (!res.ok) { err.textContent = data.error || 'Could not set password'; return; }
      location.href = '/buyer/dashboard.html';
    } catch (e) { err.textContent = 'Could not reach the server.'; }
  };
</script>
</body>
</html>
